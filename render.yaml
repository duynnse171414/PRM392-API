services:
  - type: web
    name: myapp-api
    env: docker
    plan: free
    autoDeploy: true
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /swagger/index.html
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: MyApp
      - key: Jwt__Audience
        value: MyAppUsers
